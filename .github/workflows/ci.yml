name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test with race
        run: go test -race ./...
      - name: Coverage
        shell: bash
        run: go test -coverprofile=coverage.out ./...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: CLI smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/agentforge --version
          go run ./cmd/agentforge --mock --headless --prompt "hello" >/tmp/headless.out
          grep -q "mock assistant reply" /tmp/headless.out
          go run ./cmd/agentforge agent --prompt "run echo hello" --yes --test "" --workdir /tmp >/tmp/agent.out
          grep -q "Output: hello" /tmp/agent.out

  linux-libsecret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install libsecret development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libglib2.0-dev
      - name: Test libsecret native backend
        run: go test -tags libsecret ./internal/secret/...

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build release binaries
        run: make release
      - name: Package release archives
        run: make package
      - name: Generate SBOM
        run: make sbom
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-release
          path: dist/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
