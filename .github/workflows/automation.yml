name: Automation

on:
  workflow_dispatch:
    inputs:
      job-config:
        description: 'Job JSON 配置文件路径（相对仓库根目录），默认 .github/automation-example.json'
        required: false
        default: '.github/automation-example.json'
        type: string

permissions:
  contents: read

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Run agentforge-automation
        env:
          JOB_CONFIG: ${{ inputs.job-config }}
        run: |
          CONFIG="${JOB_CONFIG:-.github/automation-example.json}"
          echo "Using automation config: ${CONFIG}"
          go run ./cmd/agentforge-automation --once --config "${CONFIG}"
