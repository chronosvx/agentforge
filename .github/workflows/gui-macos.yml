name: Build macOS GUI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build macOS GUI
        run: make gui-macos
      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-gui-macos
          path: |
            dist/agentforge_gui*.dmg
            dist/agentforge_gui.app
            dist/gui-checksums.txt
          if-no-files-found: error
